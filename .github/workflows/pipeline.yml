name: Pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # 15m budget: the collector alone now holds the firehose open for 7m
    # (see COLLECTOR_DURATION_SECONDS below), and the worker step scales with
    # post volume, so it needs real headroom on top of that.
    #   420s collector + ~40s fixed overhead (checkout, setup-python, pip
    #   install, cache restore/save, commit+push) leaves ~440s of the 900s
    #   budget for the worker. The worker took ~12s for 18 posts, so even at
    #   5x the volume (~60s) -- plus the extra geocode/LLM calls that the
    #   revived Groq model and the loosened name check now let through -- it
    #   fits several times over.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore DB from cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: posts-db-${{ github.run_id }}
          restore-keys: |
            posts-db-

      - name: Ensure data directories exist
        run: mkdir -p data/raw data/archive

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python -m pipeline.collector
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          DB_PATH: data/raw/posts.db
          # Long collection window on purpose. The cron above asks for every
          # 15 minutes, but GitHub's scheduler only actually fires this job
          # ~4-6 times a day (a known GitHub limitation we accept). At 180s
          # that was only ~12-18 minutes of firehose coverage per DAY, which
          # is why the map went nearly empty. Since we get so few firings,
          # each one has to do much more work: 420s x ~5 firings is ~35
          # minutes of coverage a day. This repo is public, so Actions
          # minutes are unlimited and the longer run costs nothing.
          COLLECTOR_DURATION_SECONDS: "420"

      - name: Run worker
        run: python worker.py
        env:
          DB_PATH: data/raw/posts.db
          # LLM_PROVIDER defaults to "claude" in config.py; set here too so
          # it's visible/toggleable from the workflow without a code change.
          # GROQ_API_KEY is left in place so flipping this back to "groq"
          # needs only this one line edited, not a redeploy.
          LLM_PROVIDER: claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Save DB to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: posts-db-${{ github.run_id }}

      - name: Commit and push map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.geojson data/archive/
          git diff --cached --quiet || git commit -m "Update map data"

          # live.geojson and the archive files are always fully regenerated
          # each run (never hand-edited), so on a push conflict the freshest
          # regeneration should just win -- a line-based rebase can't
          # reconcile two full-file rewrites and fails outright. Retry with
          # a merge that prefers our side for these generated paths; other
          # files (e.g. frontend commits landing in parallel) still merge
          # normally via the 3-way merge.
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rejected, retrying with merge (attempt $i)..."
            git fetch origin main
            git merge -X ours --no-edit origin/main
            if [ "$i" -eq 5 ]; then
              echo "Giving up after 5 attempts"
              exit 1
            fi
            sleep $(( (RANDOM % 5) + 1 ))
          done
